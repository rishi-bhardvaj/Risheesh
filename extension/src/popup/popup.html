<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Career OS</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #E2E8F0;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #00D09C;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      background: #1C1C1E;
      color: #A0AEC0;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-top: 8px;
      background: #00D09C;
      color: #121212;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h2>Career OS Companion</h2>
  <div class="status-badge" id="status">Standby / Unpaired</div>
  <p style="font-size: 12px; color: #94A3B8;">Capture jobs via right-click or sync with your personal Career OS server.</p>
  <a class="btn" href="../options/options.html" target="_blank">Settings & Pairing</a>
</body>
</html>
